# SPDX-License-Identifier: GPL-2.0-only OR BSD-3-Clause
name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  # Opt into Node 24 runtime ahead of GitHub's Node 20 deprecation cutoff
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Upstream commit the patch series is generated against (v7.4-rc1 merge window)
  KERNEL_BASE: d48723711bae9b8cdc56719c448ba42fef28cbee

jobs:
  scripts:
    name: Scripts, unit tests, and cross-LTS integrator checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: >-
          python3 -m py_compile
          scripts/patch_rtw89.py
          scripts/verify_monitor_diag.py
          scripts/verify_hardware.py
          tests/test_patch_rtw89.py

      - name: Shell syntax and shellcheck
        run: |
          bash -n scripts/build_module.sh
          bash -n scripts/dkms_prepare.sh
          bash -n scripts/prepare_submission.sh
          sh -n scripts/dkms_pre_build.sh
          shellcheck -S warning scripts/build_module.sh scripts/dkms_prepare.sh scripts/prepare_submission.sh scripts/dkms_pre_build.sh

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Cross-LTS patch_rtw89.py apply/revert check (v6.1, v6.6, v6.12 Gen 1 & v6.15, v6.18 Gen 2)
        run: |
          set -euo pipefail
          for tag_gen in "v6.1:1" "v6.6:1" "v6.12:1" "v6.15:2" "v6.18:2"; do
            tag="${tag_gen%%:*}"
            gen="${tag_gen##*:}"
            dir="$(mktemp -d)"
            git -C "$dir" init -q
            git -C "$dir" remote add origin https://github.com/torvalds/linux.git
            git -C "$dir" sparse-checkout init --cone
            git -C "$dir" sparse-checkout set drivers/net/wireless/realtek/rtw89
            git -C "$dir" fetch -q --depth 1 --filter=blob:none origin "refs/tags/${tag}"
            git -C "$dir" checkout -q FETCH_HEAD
            cp -a "$dir/drivers/net/wireless/realtek/rtw89" "${dir}/orig"
            python3 scripts/patch_rtw89.py --rtw89-dir "$dir/drivers/net/wireless/realtek/rtw89" --apply
            grep -qx "#define RTW89_MON_API_GEN ${gen}" \
              "$dir/drivers/net/wireless/realtek/rtw89/rtw89_mon_autoconf.h"
            if [[ "$tag" == "v6.18" ]]; then
              # Also verify dkms_pre_build.sh accepts both stable and -rc target strings
              dkms_dir="${dir}/dkms_test"
              mkdir -p "${dkms_dir}/src" "${dkms_dir}/scripts"
              cp -a "${dir}/orig/." "${dkms_dir}/"
              cp src/rtw89_mon.c src/rtw89_mon.h "${dkms_dir}/src/"
              cp scripts/patch_rtw89.py scripts/dkms_pre_build.sh "${dkms_dir}/scripts/"
              echo "6.18" > "${dkms_dir}/RTW89_SOURCE_KERNEL"
              (cd "${dkms_dir}" && sh scripts/dkms_pre_build.sh "6.18-rc4")
              if (cd "${dkms_dir}" && sh scripts/dkms_pre_build.sh "6.19.0-generic" 2>/dev/null); then
                echo "::error::dkms_pre_build.sh accepted mismatched kernel series"
                exit 1
              fi
            fi
            python3 scripts/patch_rtw89.py --rtw89-dir "$dir/drivers/net/wireless/realtek/rtw89" --revert
            diff -r "$dir/drivers/net/wireless/realtek/rtw89" "${dir}/orig"
            rm -rf "$dir"
            echo "OK: ${tag} (API Gen ${gen})"
          done

  kernel:
    name: Kernel build (W=1, sparse) and checkpatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev sparse

      - name: Fetch upstream kernel at the series base
        run: |
          git init -q linux
          git -C linux fetch -q --depth 1 https://github.com/torvalds/linux.git "$KERNEL_BASE"
          git -C linux checkout -q FETCH_HEAD
          git -C linux config user.name CI
          git -C linux config user.email ci@example.invalid

      - name: Configure and prepare
        working-directory: linux
        run: |
          make -s defconfig
          ./scripts/config -e PCI -e USB -e CFG80211 -e MAC80211 -e WLAN -e WLAN_VENDOR_REALTEK \
            -m RTW89 -m RTW89_PCI -m RTW89_USB \
            -m RTW89_8852AE -m RTW89_8852AU \
            -m RTW89_8852BE -m RTW89_8852BU -m RTW89_8852BTE \
            -m RTW89_8852CE -m RTW89_8852CU \
            -m RTW89_8851BE -m RTW89_8851BU \
            -m RTW89_8922AE -m RTW89_8922AU -m RTW89_8922DE \
            -e RTW89_DEBUGMSG -e RTW89_DEBUGFS -e PROVE_LOCKING
          make -s olddefconfig
          make -s -j"$(nproc)" modules_prepare
          cp -a drivers/net/wireless/realtek/rtw89 ../pristine-rtw89

      - name: Baseline build
        working-directory: linux
        run: |
          make -j"$(nproc)" KBUILD_MODPOST_WARN=1 W=1 C=1 \
            M=drivers/net/wireless/realtek/rtw89 modules 2>&1 | tee ../base.log
          grep -E 'warning:|error:' ../base.log | sed -E 's/:[0-9]+:[0-9]+:/:/' | sort > ../base.warn || true

      - name: Apply PATCH v5 (git am) and check every patch builds
        working-directory: linux
        run: |
          set -euo pipefail
          mapfile -t series < <(ls ../repo/patches/v5/v5-00*-wifi-*.patch | sort)
          for p in "${series[@]}"; do
            git am -q "$p"
            make -s -j"$(nproc)" KBUILD_MODPOST_WARN=1 \
              M=drivers/net/wireless/realtek/rtw89 modules
            echo "OK: $(basename "$p")"
          done

      - name: W=1 / sparse warnings must not increase
        working-directory: linux
        run: |
          touch drivers/net/wireless/realtek/rtw89/*.c
          make -j"$(nproc)" KBUILD_MODPOST_WARN=1 W=1 C=1 \
            M=drivers/net/wireless/realtek/rtw89 modules 2>&1 | tee ../v5.log
          grep -E 'warning:|error:' ../v5.log | sed -E 's/:[0-9]+:[0-9]+:/:/' | sort > ../v5.warn || true
          if comm -13 ../base.warn ../v5.warn | grep .; then
            echo "::error::PATCH v5 introduces new compiler or sparse warnings"
            exit 1
          fi

      - name: checkpatch.pl --strict and submission preflight
        working-directory: linux
        run: |
          # UNKNOWN_COMMIT_ID: the ids in Fixes: tags cannot be resolved in a shallow clone
          bash ../repo/scripts/prepare_submission.sh --kernel-dir .

      - name: Out-of-tree integrator builds against the same kernel
        run: |
          set -euo pipefail
          rm -rf oot && cp -a pristine-rtw89 oot
          python3 repo/scripts/patch_rtw89.py --rtw89-dir oot --apply
          make -C linux -j"$(nproc)" KBUILD_MODPOST_WARN=1 W=1 C=1 M="$PWD/oot" modules 2>&1 | tee oot.log
          if grep -E 'warning:|error:' oot.log; then
            echo "::error::integrator build has warnings"
            exit 1
          fi
          python3 repo/scripts/patch_rtw89.py --rtw89-dir oot --revert
          diff -r oot pristine-rtw89 --exclude='*.o' --exclude='*.ko' \
            --exclude='*.mod*' --exclude='.*' --exclude='modules.order' --exclude='Module.symvers'

  lts-kbuild:
    name: Out-of-tree Kbuild (${{ matrix.kernel.tag }}, API Gen ${{ matrix.kernel.gen }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - { tag: "v6.6", gen: "1" }
          - { tag: "v6.12", gen: "1" }
          - { tag: "v6.18", gen: "2" }
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev sparse

      - name: Fetch Linux ${{ matrix.kernel.tag }}
        run: |
          git init -q linux
          git -C linux fetch -q --depth 1 https://github.com/torvalds/linux.git "refs/tags/${{ matrix.kernel.tag }}"
          git -C linux checkout -q FETCH_HEAD

      - name: Configure and prepare (${{ matrix.kernel.tag }})
        working-directory: linux
        run: |
          make -s defconfig
          ./scripts/config -e PCI -e USB -e CFG80211 -e MAC80211 -e WLAN -e WLAN_VENDOR_REALTEK \
            -m RTW89 -m RTW89_PCI -m RTW89_USB \
            -m RTW89_8852AE -m RTW89_8852AU \
            -m RTW89_8852BE -m RTW89_8852BU -m RTW89_8852BTE \
            -m RTW89_8852CE -m RTW89_8852CU \
            -m RTW89_8851BE -m RTW89_8851BU \
            -m RTW89_8922AE -m RTW89_8922AU \
            -e RTW89_DEBUGMSG -e RTW89_DEBUGFS -e PROVE_LOCKING
          make -s olddefconfig
          make -s -j"$(nproc)" modules_prepare
          cp -a drivers/net/wireless/realtek/rtw89 ../pristine-rtw89

      - name: Baseline out-of-tree build (${{ matrix.kernel.tag }})
        run: |
          set -euo pipefail
          cp -a pristine-rtw89 base-oot
          make -C linux -j"$(nproc)" KBUILD_MODPOST_WARN=1 W=1 C=1 \
            M="$PWD/base-oot" modules 2>&1 | tee base.log
          grep -E 'warning:|error:' base.log | sed -E 's|^.*/base-oot/|rtw89/|; s/:[0-9]+:[0-9]+:/:/' | sort -u > base.warn || true

      - name: Patched out-of-tree build & revert (${{ matrix.kernel.tag }})
        run: |
          set -euo pipefail
          cp -a pristine-rtw89 oot
          python3 repo/scripts/patch_rtw89.py --rtw89-dir oot --apply
          grep -qx "#define RTW89_MON_API_GEN ${{ matrix.kernel.gen }}" oot/rtw89_mon_autoconf.h
          make -C linux -j"$(nproc)" KBUILD_MODPOST_WARN=1 W=1 C=1 \
            M="$PWD/oot" modules 2>&1 | tee oot.log
          grep -E 'warning:|error:' oot.log | sed -E 's|^.*/oot/|rtw89/|; s/:[0-9]+:[0-9]+:/:/' | sort -u > oot.warn || true
          if comm -13 base.warn oot.warn | grep .; then
            echo "::error::Out-of-tree build on ${{ matrix.kernel.tag }} introduced compiler or sparse warnings"
            exit 1
          fi
          test -f oot/rtw89_core.ko
          test -f oot/rtw89_8852ae.ko
          if [[ "${{ matrix.kernel.tag }}" != "v6.6" ]]; then
            test -f oot/rtw89_8922ae.ko
          fi
          python3 repo/scripts/patch_rtw89.py --rtw89-dir oot --revert
          diff -r oot pristine-rtw89 --exclude='*.o' --exclude='*.ko' \
            --exclude='*.mod*' --exclude='.*' --exclude='modules.order' --exclude='Module.symvers'
