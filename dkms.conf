# DKMS configuration for rebuilding patched rtw89 modules across kernel upgrades.
# Place your distribution's drivers/net/wireless/realtek/rtw89/* sources plus
# src/ and scripts/ into /usr/src/rtw89-monitor-injection-4.0/ before running
# `dkms add/build/install`. PRE_BUILD automatically applies scripts/patch_rtw89.py.

PACKAGE_NAME="rtw89-monitor-injection"
PACKAGE_VERSION="4.0"
PRE_BUILD="python3 scripts/patch_rtw89.py --rtw89-dir . --apply"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build -j$(nproc) modules"

# Core + PCI modules present across all supported kernels (Linux 6.1+)
BUILT_MODULE_NAME[0]="rtw89_core"
DEST_MODULE_LOCATION[0]="/updates/rtw89"
BUILT_MODULE_NAME[1]="rtw89_pci"
DEST_MODULE_LOCATION[1]="/updates/rtw89"
BUILT_MODULE_NAME[2]="rtw89_8852a"
DEST_MODULE_LOCATION[2]="/updates/rtw89"
BUILT_MODULE_NAME[3]="rtw89_8852ae"
DEST_MODULE_LOCATION[3]="/updates/rtw89"
BUILT_MODULE_NAME[4]="rtw89_8852b"
DEST_MODULE_LOCATION[4]="/updates/rtw89"
BUILT_MODULE_NAME[5]="rtw89_8852be"
DEST_MODULE_LOCATION[5]="/updates/rtw89"
BUILT_MODULE_NAME[6]="rtw89_8852c"
DEST_MODULE_LOCATION[6]="/updates/rtw89"
BUILT_MODULE_NAME[7]="rtw89_8852ce"
DEST_MODULE_LOCATION[7]="/updates/rtw89"

# Dynamically register optional chip and USB modules (8851b, 8852b_common,
# 8852bt, 8922a, rtw89_usb, etc.) when present in the target rtw89 Makefile.
_rtw89_idx=8
_rtw89_mk="${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/Makefile"
[ ! -f "${_rtw89_mk}" ] && _rtw89_mk="${source_tree}/${PACKAGE_NAME}-${PACKAGE_VERSION}/Makefile"
if [ -f "${_rtw89_mk}" ]; then
    for _mod in rtw89_8851b rtw89_8851be rtw89_8852b_common rtw89_8852bt rtw89_8852bte rtw89_8922a rtw89_8922ae rtw89_usb rtw89_8851bu rtw89_8852au rtw89_8852bu; do
        if grep -q "${_mod}\.o" "${_rtw89_mk}" 2>/dev/null; then
            BUILT_MODULE_NAME[${_rtw89_idx}]="${_mod}"
            DEST_MODULE_LOCATION[${_rtw89_idx}]="/updates/rtw89"
            _rtw89_idx=$((_rtw89_idx + 1))
        fi
    done
fi

AUTOINSTALL="yes"
